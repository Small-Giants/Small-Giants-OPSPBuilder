name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The Firestore rules emulator runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci
      - run: npm --prefix functions ci

      - name: Typecheck app
        run: npx tsc --noEmit

      - name: Build functions
        run: npm --prefix functions run build

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-opsp "npx vitest run tests/rules"

      - name: Build app
        run: npm run build
